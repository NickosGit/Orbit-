<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Orbit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-accent="violet">
  <div id="backdrop"><div id="backdrop-img"></div></div>

  <header id="titlebar">
    <div class="brand"><img src="icon.png" alt="" class="brand-icon" />ORBIT</div>
    <div class="drag"></div>
    <button id="update-pill" class="update-pill hidden"></button>
    <div class="winctl">
      <button data-win="min" title="Minimizar"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="max" title="Maximizar"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
      <button data-win="close" class="close" title="Cerrar"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <div id="shell">
    <nav id="sidebar">
      <button class="nav active" data-page="home" title="Inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
      <button class="nav" data-page="discover" title="Descubrir"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Descubrir</span></button>
      <button class="nav" data-page="library" title="Biblioteca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Biblioteca</span></button>
      <button class="nav" data-page="servers" title="Servidores"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Servidores</span></button>
      <button class="nav" data-page="mods" title="Mods"><svg viewBox="0 0 24 24"><path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 15.4 7.2 18l.9-5.4-3.9-3.8 5.4-.8z"/></svg><span>Mods</span></button>
      <button class="nav" data-page="stats" title="Estadísticas"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stats</span></button>
      <div class="nav-spacer"></div>
      <button class="nav" data-page="settings" title="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ajustes</span></button>
      <button class="nav avatar-btn" data-page="profile" title="Perfil"><img id="side-avatar" alt="" /><span>Perfil</span></button>
    </nav>

    <main id="main"></main>

    <aside id="friends">
      <div class="fr-head">
        <h3>Amigos</h3>
        <span id="fr-count" class="pill"></span>
      </div>
      <input id="fr-search" class="input sm" placeholder="Buscar amigo…" />
      <div id="fr-list"></div>
    </aside>
  </div>

  <div id="modal" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
